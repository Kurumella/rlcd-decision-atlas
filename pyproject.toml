[project]
name = "rlcd-decision-atlas"
version = "0.1.0"
description = "Data preparation for rlcd-decision-atlas: many public sources converted to single-gold typed decisions"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kurumella", email = "goutam.kurumella@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # datasets 4+ drops the loading scripts several sources still ship; the converters need 3.x.
    "datasets>=3.2,<4",
]

[project.urls]
Repository = "https://github.com/Kurumella/rlcd-decision-atlas"
Dataset = "https://huggingface.co/datasets/goutam/rlcd-decision-atlas"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access to the Hugging Face hub",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decision_atlas"]
